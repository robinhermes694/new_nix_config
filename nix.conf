# Linux-only. rebuild.sh symlinks this to ~/.config/nix/nix.conf.
#
# This is a *single-user* Nix install: /nix is a bind mount of ~/.nix-store on
# the persistent home disk and every store path is owned by the login user, so
# there is no nix-daemon and no nixbld build users.
#
# That is deliberate. VMs re-run /opt/setup.sh when the
# machine is assigned to a user, which resets the boot disk -- /etc/nix,
# /etc/systemd/system/nix-daemon.service and the nixbld accounts all vanish,
# and a multi-user Nix is left talking to a dead daemon socket. Keeping the
# whole install on the home disk means nothing to repair after a re-assignment.
#
# On Darwin, nix-darwin owns /etc/nix instead and this file is unused.

experimental-features = nix-command flakes

# No daemon, so builds run as the login user rather than as nixbld*.
build-users-group =

# Lets `nix shell nixpkgs#foo` resolve against the flake registry.
extra-nix-path = nixpkgs=flake:nixpkgs
